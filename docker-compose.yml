# Production-style deployment on a single VPS: the app behind Caddy, which
# terminates HTTPS. Configure with a .env file (see .env.example).
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - catalog-data:/data # SQLite catalog; survives restarts and redeploys
    # On SIGTERM a running update is saved as INTERRUPTED; give it time.
    stop_grace_period: 15s
    expose:
      - "8080" # reachable only through Caddy

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # TLS certificates
      - caddy-config:/config

volumes:
  catalog-data:
  caddy-data:
  caddy-config:
