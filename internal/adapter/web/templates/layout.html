{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{if .Refresh}}<meta http-equiv="refresh" content="2">{{end}}
<title>{{.Title}} · Catalog Sync</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --text:#1d1d1b; --muted:#6b6b66; --line:#e3e2dd;
          --ok:#1f7a3f; --warn:#a35a00; --bad:#b3261e; --info:#1f5fa8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#171716; --card:#22221f; --text:#ecebe6; --muted:#a3a29b; --line:#383833;
            --ok:#5cc782; --warn:#f0a44a; --bad:#f08079; --info:#7fb2f0; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { border-bottom:1px solid var(--line); background:var(--card); }
  nav { max-width:1100px; margin:0 auto; padding:12px 16px; display:flex; gap:20px; align-items:center; }
  nav b { margin-right:auto; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  a { color:var(--info); }
  h1 { font-size:22px; margin:8px 0 16px; } h2 { font-size:17px; margin:0 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:16px; }
  .attention { border-left:4px solid var(--warn); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .muted, .hint { color:var(--muted); }
  .flash { padding:10px 14px; border-radius:6px; border:1px solid var(--line); background:var(--card); }
  .flash.ok { border-left:4px solid var(--ok); } .flash.err { border-left:4px solid var(--bad); }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; background:var(--card); }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:13px; color:var(--muted); font-weight:600; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:600; border:1px solid currentColor; }
  .completed, .active, .created, .reactivated, .resolved { color:var(--ok); }
  .running, .updated { color:var(--info); }
  .failed, .interrupted, .open, .invalid { color:var(--bad); }
  .withdrawn, .ignored_stale { color:var(--warn); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(110px, 1fr)); gap:10px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
  .stat b { display:block; font-size:20px; }
  button { font:inherit; padding:5px 14px; border-radius:6px; border:1px solid var(--line); background:var(--text); color:var(--bg); cursor:pointer; }
  select, input { font:inherit; padding:5px 8px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--text); max-width:100%; }
  form { margin:0; }
  ul.fields { margin:0; padding-left:18px; }
</style>
</head>
<body>
<header><nav><b>Catalog Sync</b><a href="/">Updates</a><a href="/issues">Issues</a><a href="/products">Catalog</a></nav></header>
<main>
{{if .Flash}}<p class="flash ok">{{.Flash}}</p>{{end}}
{{if .Error}}<p class="flash err">{{.Error}}</p>{{end}}
{{template "content" .Data}}
</main>
</body>
</html>{{end}}
