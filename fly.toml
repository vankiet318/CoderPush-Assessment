# Fly.io configuration. Change `app` to a globally unique name before launching.
app = "catalogsync-demo"
primary_region = "sin"

# The app saves a running update as INTERRUPTED on SIGTERM; give it time.
kill_signal = "SIGTERM"
kill_timeout = 10

[build]
  dockerfile = "Dockerfile"

# The SQLite catalog lives on a persistent volume so it survives restarts and
# deploys. Create it once: fly volumes create catalog_data --size 1
[mounts]
  source = "catalog_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Idle machines stop to save cost; an update cut off this way is resumable.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
